name: Build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: Open420

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: Open420
          toolchains: arm-zephyr-eabi

      - name: Build basefirm
        run: west build -p always -b nucleo_u575zi_q Open420/firmware/basefirm

  licensing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: fsfe/reuse-action@v6
